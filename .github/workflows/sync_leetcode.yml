name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install glsync
        run: go install github.com/ahmed-e-abdulaziz/glsync@latest

      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          glsync \
            -lc-cookie="$LEETCODE_SESSION" \
            -repo-url="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
